-- Publik: info rapat aktif (tanpa OTP)
create function get_active() returns json language sql security definer set search_path=public as $$
 select json_build_object(
  'meeting',(select row_to_json(m) from (select id,title,date,time,location from meetings where status='open' limit 1) m),
  'participants',(select coalesce(json_agg(p order by p.no),'[]'::json) from (select id,no,name from participants where active) p),
  'done',(select coalesce(json_agg(a.participant_id),'[]'::json) from attendance a join meetings m on m.id=a.meeting_id where m.status='open'));
$$;

-- Publik: absen. OTP, batas percobaan, duplikat, dan waktu semua divalidasi di server (Postgres)
create function submit_attendance(p_pid int, p_otp text, p_photo text) returns json language plpgsql security definer set search_path=public as $$
declare m meetings; k text; n text; t timestamptz;
begin
 select * into m from meetings where status='open' limit 1;
 if not found then return json_build_object('error','Absensi sedang ditutup'); end if;
 select name into n from participants where id=p_pid and active;
 if n is null then return json_build_object('error','Peserta tidak valid'); end if;
 k := m.id||':'||p_pid;
 if (select count(*) from otp_attempts where key=k and created_at>now()-interval '10 minutes')>=5 then
  return json_build_object('error','Terlalu banyak percobaan. Coba lagi 10 menit lagi.'); end if;
 if m.otp_code is null or m.otp_expires<now() or m.otp_code<>trim(p_otp) then
  insert into otp_attempts(key) values(k);
  return json_build_object('error','Kode OTP salah atau sudah kedaluwarsa'); end if;
 if exists(select 1 from attendance where meeting_id=m.id and participant_id=p_pid) then
  return json_build_object('error','Kamu sudah absen di rapat ini'); end if;
 if p_photo !~ '^data:image/jpeg;base64,' or length(p_photo)>600000 then
  return json_build_object('error','Foto bukti tidak valid / terlalu besar'); end if;
 insert into attendance(meeting_id,participant_id,photo) values(m.id,p_pid,p_photo) returning attended_at into t;
 return json_build_object('name',n,'attended_at',t);
exception when unique_violation then return json_build_object('error','Kamu sudah absen di rapat ini');
end $$;

-- Admin: buat/ganti OTP (acak di server) dan ubah status rapat
create function admin_make_otp(p_id uuid, p_min int) returns json language plpgsql security definer set search_path=public as $$
declare c text := lpad((('x'||left(replace(gen_random_uuid()::text,'-',''),8))::bit(32)::bigint % 1000000)::text,6,'0');
begin
 update meetings set otp_code=c, otp_expires=now()+make_interval(mins=>least(3,greatest(1,p_min))) where id=p_id and status='open';
 if not found then raise exception 'Buka absensi terlebih dahulu'; end if;
 return json_build_object('otp',c);
end $$;
create function admin_set_status(p_id uuid, p_status text) returns void language plpgsql security definer set search_path=public as $$
begin
 if p_status not in ('draft','open','closed') then raise exception 'Status tidak valid'; end if;
 if p_status='open' then update meetings set status='closed',otp_code=null,otp_expires=null where status='open' and id<>p_id; end if;
 update meetings set status=p_status, otp_code=case when p_status='open' then otp_code end, otp_expires=case when p_status='open' then otp_expires end where id=p_id;
end $$;

revoke all on function admin_make_otp(uuid,int), admin_set_status(uuid,text) from public, anon;
grant execute on function admin_make_otp(uuid,int), admin_set_status(uuid,text) to authenticated;
grant execute on function get_active(), submit_attendance(int,text,text) to anon, authenticated;
